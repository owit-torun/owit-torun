<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wskaźniki – panel pracownika | OWiT Toruń</title>
    <meta name="description" content="Wewnętrzny panel realizacji wskaźników projektu – OWiT Toruń.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="64x64" href="images/ui/favicon-64.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind = { config: { theme: { extend: { colors: { green: {
            50: '#edf9ee', 100: '#d1f2d4', 200: '#a3e5a9', 300: '#6fd278', 400: '#45a94d', 500: '#45a94d',
            600: '#389140', 700: '#2b7333', 800: '#1f5526', 900: '#13381a' } } } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; background: #f9fafb; }
        .skip-link { position: absolute; left: -9999px; top: 1rem; background: #1f5526; color: #fff; padding: .5rem 1.25rem; border-radius: 0 0 .5rem .5rem; font-weight: 700; z-index: 9999; text-decoration: none; transition: left .2s; }
        .skip-link:focus { left: 0; }
        :focus-visible { outline: 3px solid #2b7333 !important; outline-offset: 3px !important; border-radius: 4px; }
        .fld { width: 100%; padding: .5rem .75rem; border: 1px solid #e5e7eb; border-radius: .5rem; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .fld:focus { outline: none; border-color: #45a94d; box-shadow: 0 0 0 2px #a3e5a9; }
        .lbl { display: block; font-size: .7rem; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .25rem; }
        .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: .75rem; font-weight: 600; font-size: .875rem; cursor: pointer; transition: background .15s; }
        .btn-primary { background: #2b7333; color: #fff; } .btn-primary:hover { background: #1f5526; }
        .btn-ghost { background: #fff; color: #374151; border: 1px solid #e5e7eb; } .btn-ghost:hover { background: #edf9ee; border-color: #6fd278; color: #2b7333; }
        .tab { padding: .5rem 1rem; font-size: .875rem; font-weight: 600; border-bottom: 2px solid transparent; color: #6b7280; white-space: nowrap; cursor: pointer; }
        .tab:hover { color: #374151; background: #f9fafb; }
        .tab[aria-selected="true"] { color: #2b7333; border-color: #2b7333; background: #edf9ee; }
        th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; font-weight: 700; padding: .5rem .6rem; background: #f9fafb; white-space: nowrap; }
        td { padding: .5rem .6rem; border-top: 1px solid #f3f4f6; vertical-align: top; }
        .bar { height: .6rem; background: #e5e7eb; border-radius: 999px; position: relative; overflow: visible; }
        .bar > i { display: block; height: 100%; border-radius: 999px; }
        .bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #374151; opacity: .55; }
        @media print { #site-header, #site-footer, .no-print { display: none !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">
    <a href="#main" class="skip-link">Przejdź do treści głównej</a>
    <header id="site-header"></header>

    <main id="main" class="flex-1 pt-32 pb-20 px-4">
        <div class="max-w-6xl mx-auto" id="root">
            <div class="flex items-center justify-center py-24 text-gray-400 gap-3">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i><span class="text-sm">Ładowanie…</span>
            </div>
        </div>
    </main>

    <div id="modalRoot"></div>
    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBqb71Xupzcv4aEaszY7kIqwjyWbdJge3s",
            authDomain: "katalog-owit.firebaseapp.com",
            databaseURL: "https://katalog-owit-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "katalog-owit",
            storageBucket: "katalog-owit.firebasestorage.app",
            messagingSenderId: "884136463755",
            appId: "1:884136463755:web:d5f89d99b723fe0b73b38e"
        });
        const database = firebase.database();
        const auth = firebase.auth();

        // ===== KONFIGURACJA =====
        // Konta z dostępem do wskaźników. Kolejni pracownicy: dopisz e-mail do ALLOWED.
        const ALLOWED = ['admin@owit.pl', 'adrian@owit.pl', 'marcin@owit.pl'];
        const ADMINS = ['admin@owit.pl'];
        const NAMES = { 'adrian@owit.pl': 'Adrian Kędzior', 'marcin@owit.pl': 'Marcin Kos' };
        // Wymagane wskaźniki (jak w arkuszu Excel dla Adriana i Marcina). Admin może zmienić per pracownik/rok.
        const DEFAULT_TARGETS = { newPesel: 17, porada: 57, instruktaz: 40, testowanie: 26, wypozyczenie: 40 };
        const INDICATORS = [
            { key: 'newPesel', label: 'Nowy PESEL', icon: 'user-plus' },
            { key: 'porada', label: 'Porada', icon: 'message-circle' },
            { key: 'instruktaz', label: 'Instruktaż', icon: 'book-open' },
            { key: 'testowanie', label: 'Testowanie', icon: 'flask-conical' },
            { key: 'wypozyczenie', label: 'Wypożyczenie', icon: 'package-check' },
        ];
        const MONTHS = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];

        // ===== STAN =====
        let me = null, isAdmin = false;
        let year = String(new Date().getFullYear());
        let DB = { entries: {}, network: {}, targets: {}, links: {} };
        let inventoryData = {}, historyData = null, historyError = false;
        let tab = 'ben', adminTab = 'team', selectedEmp = null;
        let listeners = [];
        // Rejestr osób: każdy beneficjent ma jeden trwały personId (indicators/persons), a personKeys pilnuje unikalności
        let PERSONS = {}, KEYS = {}, _regP = false, _regK = false, _regErr = false, _migrating = false, _migFailed = false;
        const _migDone = new Set();
        const regOk = () => _regP && _regK && !_regErr;

        // ===== NARZĘDZIA =====
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const n = (v) => Math.max(0, parseInt(v, 10) || 0);
        const ek = (email) => email.replace(/[@.]/g, '_');
        const todayStr = () => new Date().toISOString().split('T')[0];
        const fmt = (d) => d ? d.split('-').reverse().join('.') : '–';
        const nameOf = (email) => NAMES[email] || email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const employees = () => ALLOWED.filter(e => !ADMINS.includes(e));
        const icons = () => { if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } }); };

        // ===== DANE =====
        function targetsFor(email) {
            const t = ((DB.targets[ek(email)] || {})[year]) || {};
            const out = {};
            for (const k in DEFAULT_TARGETS) out[k] = t[k] != null ? n(t[k]) : DEFAULT_TARGETS[k];
            return out;
        }
        function entriesFor(email) {
            const o = DB.entries[ek(email)] || {};
            return Object.entries(o).map(([id, e]) => ({ ...e, id }));
        }
        function networkFor(email) {
            const o = DB.network[ek(email)] || {};
            return Object.entries(o).map(([id, e]) => ({ ...e, id }));
        }
        // Dopasowanie wypożyczeń z katalogu do beneficjentów
        const norm = (s) => String(s || '').normalize('NFD').toLowerCase().replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').trim();
        const words = (s) => norm(s).split(/[\s\-]+/).filter(Boolean);
        // Klucz osoby niezależny od kolejności: „Jan Kowalski” = „Kowalski Jan”
        const nameKey = (s) => words(s).sort().join(' ');
        // Osoba = imię i nazwisko + opcjonalny dopisek (rozróżnia imienników, np. rok urodzenia). Klucz służy tylko do wyszukiwania w rejestrze.
        const personKey = (name, tag) => { const k = nameKey(name); return k ? k + (nameKey(tag) ? '#' + nameKey(tag) : '') : ''; };
        async function hashKey(s) {
            try {
                const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('owit-wsk:' + s));
                return [...new Uint8Array(b)].slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join('');
            } catch (_) { let h = 5381; for (const c of 'owit-wsk:' + s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'f' + (h >>> 0).toString(16); }
        }
        const rk = (r) => ((r.deviceCode || '?') + '_' + (r.rentedAt || '?')).replace(/[.$#\[\]\/]/g, '_');
        const personOf = (e) => (e && e.personId && PERSONS[e.personId]) || null;
        // Imię i nazwisko OzN / OOzN wpisu: z rejestru (poprawka nazwiska działa wstecz), a dla starych wpisów z samego wpisu
        function entNames(e) {
            const p = personOf(e);
            if (!p) return { ozn: e.ozn || '', oozn: e.oozn || '' };
            return e.personRole === 'oozn' ? { ozn: '', oozn: p.name } : { ozn: p.name, oozn: e.oozn || '' };
        }
        // Grupowanie po osobie (personId), niezależnie od tego, z jakim opiekunem (OOzN) przyszła
        function beneficiaryGroups(email) {
            const map = new Map();
            entriesFor(email).filter(e => (e.date || '').startsWith(year)).sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(e => {
                const nm = entNames(e), p = personOf(e), name = nm.ozn || nm.oozn;
                const key = p ? 'p:' + e.personId : 'k:' + personKey(name, e.oznTag);
                if (!map.has(key)) map.set(key, { key, personId: p ? e.personId : '', name, role: nm.ozn ? 'ozn' : 'oozn', oznTag: p ? (p.tag || '') : (e.oznTag || ''), latestOozn: '', entries: [], ids: new Set(), sum: { newPesel: 0, porada: 0, instruktaz: 0, szkolenie: 0, testowanie: 0, kontakt: 0, technologia: 0, rentManual: 0, rentOgol: 0 }, scopes: new Set(), items: [] });
                const g = map.get(key); g.entries.push(e); g.ids.add(e.id); g.scopes.add(e.scope || 'osit');
                if (nm.ozn && nm.oozn) g.latestOozn = nm.oozn;
                if (e.przedmiot) g.items.push(e.przedmiot);
                const d = entryDelta(e); for (const k in d) g.sum[k] += d[k];
            });
            return [...map.values()].map(g => ({ ...g, ozn: g.role === 'ozn' ? g.name : '', oozn: g.role === 'ozn' ? g.latestOozn : g.name }));
        }
        function assignRentals(email, groups) {
            const links = DB.links[ek(email)] || {}, assigned = new Map(), unassigned = [];
            rentalsFor(email).filter(r => (r.rentedAt || '').startsWith(year)).forEach(r => {
                const add = (g, how) => { if (!assigned.has(g.key)) assigned.set(g.key, []); assigned.get(g.key).push({ r, how }); };
                const man = links[r.key] && groups.find(g => g.ids.has(links[r.key]));
                if (man) return add(man, 'manual');
                const rw = words(r.beneficiary);
                const cand = rw.length ? groups.filter(g => { const gw = words(g.ozn).concat(words(g.oozn)); return rw.every(w => gw.includes(w)); }) : [];
                if (cand.length === 1) add(cand[0], 'auto'); else unassigned.push({ r, ambiguous: cand.length > 1 });
            });
            return { assigned, unassigned };
        }
        function rentalsFor(email) {
            const em = email.toLowerCase(), out = [];
            for (const [dbKey, item] of Object.entries(inventoryData || {})) {
                Object.values((item && item.rentals) || {}).filter(Boolean).forEach(r => {
                    if ((r.addedBy || '').toLowerCase() === em)
                        out.push({ key: rk(r), itemName: dbKey.replace(/_/g, ' '), deviceCode: r.deviceCode || '', beneficiary: r.beneficiaryLastName || '', rentedAt: r.rentedAt || '', returnedAt: '', active: true });
                });
            }
            Object.values(historyData || {}).forEach(h => {
                if (h && (h.addedBy || '').toLowerCase() === em)
                    out.push({ key: rk(h), itemName: h.itemName || h.dbKey || '', deviceCode: h.deviceCode || '', beneficiary: h.beneficiaryLastName || '', rentedAt: h.rentedAt || '', returnedAt: h.returnedAt || '', active: false });
            });
            return out.sort((a, b) => (b.rentedAt || '').localeCompare(a.rentedAt || ''));
        }
        // Wkład pojedynczego wpisu we wskaźniki (jak formuły w arkuszu Excel)
        function entryDelta(e) {
            const d = { newPesel: 0, porada: 0, instruktaz: 0, szkolenie: 0, testowanie: 0, kontakt: 0, technologia: 0, rentManual: 0, rentOgol: 0 };
            if (e.newPesel) d.newPesel = 1;
            if (e.scope === 'ogol') {
                d.porada = n(e.porada); d.instruktaz = n(e.instruktaz); d.kontakt = n(e.kontakt); d.technologia = n(e.technologia);
                if (e.wypozyczenieTak) d.rentOgol = 1;
            } else {
                d.porada = n(e.poradaOzn) + n(e.poradaOozn);
                d.instruktaz = n(e.instruktazOzn) + n(e.instruktazOozn);
                d.szkolenie = n(e.szkolenieOzn) + n(e.szkolenieOozn);
                d.testowanie = n(e.testowanieOzn) + n(e.testowanieOozn);
                d.rentManual = n(e.wypozyczenie);
            }
            return d;
        }
        function computeStats(email, y = year) {
            const s = { newPesel: 0, porada: 0, instruktaz: 0, szkolenie: 0, testowanie: 0, kontakt: 0, technologia: 0, rentManual: 0, rentOgol: 0, rentAuto: 0, wypozyczenie: 0, rentNoDate: 0 };
            entriesFor(email).filter(e => (e.date || '').startsWith(y)).forEach(e => {
                const d = entryDelta(e); for (const k in d) s[k] += d[k];
            });
            rentalsFor(email).forEach(r => { if (!r.rentedAt) s.rentNoDate++; else if (r.rentedAt.startsWith(y)) s.rentAuto++; });
            s.wypozyczenie = s.rentAuto + s.rentManual + s.rentOgol;
            return s;
        }
        function monthlyStats(emails) {
            const m = Array.from({ length: 12 }, () => ({ newPesel: 0, porada: 0, instruktaz: 0, szkolenie: 0, testowanie: 0, kontakt: 0, technologia: 0, wypozyczenie: 0 }));
            emails.forEach(email => {
                entriesFor(email).filter(e => (e.date || '').startsWith(year)).forEach(e => {
                    const i = parseInt(e.date.slice(5, 7), 10) - 1; if (i < 0 || i > 11) return;
                    const d = entryDelta(e);
                    ['newPesel', 'porada', 'instruktaz', 'szkolenie', 'testowanie', 'kontakt', 'technologia'].forEach(k => m[i][k] += d[k]);
                    m[i].wypozyczenie += d.rentManual + d.rentOgol;
                });
                rentalsFor(email).filter(r => (r.rentedAt || '').startsWith(year)).forEach(r => {
                    const i = parseInt(r.rentedAt.slice(5, 7), 10) - 1; if (i >= 0 && i < 12) m[i].wypozyczenie++;
                });
            });
            return m;
        }
        const pct = (v, t) => t > 0 ? Math.round(v / t * 100) : 0;
        // Oczekiwany postęp wg kalendarza (tylko bieżący rok)
        function expectedPct() {
            const now = new Date();
            if (String(now.getFullYear()) !== year) return null;
            const start = new Date(now.getFullYear(), 0, 1), end = new Date(now.getFullYear() + 1, 0, 1);
            return Math.round((now - start) / (end - start) * 100);
        }
        const barColor = (p, exp) => p >= 100 ? '#2b7333' : (exp != null && p < exp - 15) ? '#dc2626' : (exp != null && p < exp) ? '#d97706' : '#45a94d';

        // ===== NASŁUCH FIREBASE =====
        function stopListeners() { listeners.forEach(([ref, fn]) => ref.off('value', fn)); listeners = []; }
        function listen(path, cb) {
            const ref = database.ref(path);
            const fn = (snap) => { cb(snap.val() || {}); render(); migrateOwn(); };
            ref.on('value', fn, (err) => console.warn('Wskaźniki: brak odczytu', path, err.message));
            listeners.push([ref, fn]);
        }
        function startListeners() {
            stopListeners();
            const own = ek(me.email);
            if (isAdmin) {
                listen('indicators/entries', v => DB.entries = v);
                listen('indicators/network', v => DB.network = v);
                listen('indicators/targets', v => DB.targets = v);
                listen('indicators/links', v => DB.links = v);
            } else {
                listen('indicators/entries/' + own, v => DB.entries = { [own]: v });
                listen('indicators/network/' + own, v => DB.network = { [own]: v });
                listen('indicators/targets/' + own, v => DB.targets = { [own]: v });
                listen('indicators/links/' + own, v => DB.links = { [own]: v });
            }
            listenRegistry();
            listen('inventory', v => inventoryData = v);
            loadHistory();
        }
        function listenRegistry() {
            const on = (path, cb) => {
                const ref = database.ref(path);
                const fn = (snap) => { cb(snap.val() || {}); render(); migrateOwn(); };
                ref.on('value', fn, (err) => { _regErr = true; console.warn('Rejestr osób niedostępny:', path, err.message); render(); });
                listeners.push([ref, fn]);
            };
            on('indicators/persons', v => { PERSONS = v; _regP = true; });
            on('indicators/personKeys', v => { KEYS = v; _regK = true; });
        }
        // Znajduje osobę w rejestrze albo tworzy ją atomowo: transakcja na personKeys (reguły: tylko zapis nowego klucza).
        // Dwóch pracowników dodających tę samą nową osobę dostanie ten sam personId, a created=true tylko jeden z nich.
        async function resolvePerson(name, tag, entryId) {
            const h = await hashKey(personKey(name, tag));
            if (KEYS[h]) return { personId: KEYS[h], created: false, h };
            const id = database.ref('indicators/persons').push().key;
            await database.ref('indicators/persons/' + id).set({ name: name.trim(), tag: (tag || '').trim(), createdBy: ek(me.email), createdAt: firebase.database.ServerValue.TIMESTAMP, firstEntryId: entryId || '' });
            const res = await database.ref('indicators/personKeys/' + h).transaction(cur => cur ? undefined : id);
            if (res.snapshot.val() === id) return { personId: id, created: true, h };
            database.ref('indicators/persons/' + id).remove().catch(() => {});
            return { personId: res.snapshot.val(), created: false, h };
        }
        // Stare wpisy (bez personId) dostają go przy wejściu pracownika na stronę
        async function migrateOwn() {
            if (_migrating || _migFailed || !me || !ALLOWED.includes(me.email) || !regOk()) return;
            const todo = entriesFor(me.email).filter(e => (e.ozn || e.oozn) && !_migDone.has(e.id) && (!e.personId || !PERSONS[e.personId]))
                .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            if (!todo.length) return;
            _migrating = true;
            try {
                for (const e of todo) {
                    const { personId } = await resolvePerson(e.ozn || e.oozn, e.oznTag, '');
                    await database.ref('indicators/entries/' + ek(me.email) + '/' + e.id).update({ personId, personRole: e.ozn ? 'ozn' : 'oozn' });
                    _migDone.add(e.id);
                }
            } catch (err) { _migFailed = true; console.warn('Migracja osób:', err.message); }
            _migrating = false;
        }
        async function loadHistory() {
            try {
                const snap = isAdmin
                    ? await database.ref('history').once('value')
                    : await database.ref('history').orderByChild('addedBy').equalTo(me.email).once('value');
                historyData = snap.val() || {}; historyError = false;
            } catch (e) {
                console.warn('Historia: brak uprawnień', e.message);
                historyData = {}; historyError = true;
            }
            render();
        }

        // ===== AUTH =====
        auth.onAuthStateChanged((user) => {
            stopListeners();
            DB = { entries: {}, network: {}, targets: {}, links: {} }; historyData = null; PERSONS = {}; KEYS = {}; _regP = _regK = _regErr = false; _migFailed = false; _migDone.clear();
            me = user && user.email ? { email: user.email.toLowerCase(), uid: user.uid } : null;
            isAdmin = !!me && ADMINS.includes(me.email);
            if (me && ALLOWED.includes(me.email)) {
                selectedEmp = null; adminTab = 'team'; tab = 'ben';
                startListeners();
            }
            render();
        });
        function submitLogin(ev) {
            ev.preventDefault();
            const err = $('loginErr'); err.textContent = '';
            auth.signInWithEmailAndPassword($('loginEmail').value.trim(), $('loginPassword').value)
                .catch(() => { err.textContent = 'Nieprawidłowy e-mail lub hasło.'; });
        }

        // ===== RENDER GŁÓWNY =====
        function render() {
            const root = $('root');
            if (!me) { root.innerHTML = loginView(); }
            else if (!ALLOWED.includes(me.email)) { root.innerHTML = deniedView(); }
            else { root.innerHTML = appView(); }
            icons();
        }
        function loginView() {
            return `<div class="max-w-sm mx-auto bg-white rounded-2xl shadow-lg border border-gray-100 p-6 mt-6">
                <h1 class="text-xl font-bold text-green-800 flex items-center gap-2 mb-1"><i data-lucide="lock" class="w-5 h-5"></i> Wskaźniki – logowanie</h1>
                <p class="text-sm text-gray-500 mb-5">Użyj tego samego konta, co w panelu pracownika katalogu.</p>
                <form onsubmit="submitLogin(event)" class="space-y-4">

                await database.ref('indicators/persons/' + pid).update({ name, tag });
                closeModal();
            } catch (e) { err.textContent = 'Błąd zapisu: ' + e.message; }
        }

        // ===== WIDOK ADMINA =====
        function adminView() {
            const tabs = [['team', 'Zespół – przegląd'], ['stats', 'Statystyki miesięczne'], ['emp', 'Pracownik – szczegóły'], ['import', 'Import osób']];
            const nav = `<div class="flex gap-1 border-b border-gray-200 overflow-x-auto no-print" role="tablist">${tabs.map(([k, l]) =>
                `<button role="tab" class="tab" aria-selected="${adminTab === k}" onclick="adminTab='${k}';render()">${l}</button>`).join('')}</div>`;
            let body = adminTab === 'team' ? teamOverview() : adminTab === 'stats' ? teamStats() : adminTab === 'import' ? importView() : empDetail();
            return nav + `<div class="mt-5">${body}</div>`;
        }
        function cell(v, t) {
            const p = pct(v, t), c = barColor(p, expectedPct());
            return `<td><span class="font-bold">${v}</span><span class="text-gray-400"> / ${t}</span><div class="bar mt-1 w-24" aria-hidden="true"><i style="width:${Math.min(p, 100)}%;background:${c}"></i></div><span class="text-[11px] font-semibold" style="color:${c}">${p}%</span></td>`;
        }
        function teamOverview() {
            const emps = employees(), tot = { s: {}, t: {} };
            INDICATORS.forEach(i => { tot.s[i.key] = 0; tot.t[i.key] = 0; });
            let extra = { kontakt: 0, technologia: 0, szkolenie: 0 };
            const rows = emps.map(em => {
                const s = computeStats(em), t = targetsFor(em);
                INDICATORS.forEach(i => { tot.s[i.key] += s[i.key]; tot.t[i.key] += t[i.key]; });
                for (const k in extra) extra[k] += s[k];
                return `<tr class="hover:bg-green-50/40 cursor-pointer" onclick="selectedEmp='${em}';adminTab='emp';tab='ben';render()">
                    <td class="font-semibold whitespace-nowrap">${esc(nameOf(em))}<br><span class="text-xs text-gray-400 font-normal">${esc(em)}</span></td>
                    ${INDICATORS.map(i => cell(s[i.key], t[i.key])).join('')}
                    <td class="text-xs text-gray-600 whitespace-nowrap">beneficjenci ${beneficiaryGroups(em).length}<br>kontakt ${s.kontakt}<br>technologia ${s.technologia}<br>szkolenia ${s.szkolenie}</td></tr>`;
            }).join('');
            const total = `<tr class="bg-gray-50 font-bold"><td>Razem zespół</td>${INDICATORS.map(i => cell(tot.s[i.key], tot.t[i.key])).join('')}
                <td class="text-xs text-gray-600 whitespace-nowrap">kontakt ${extra.kontakt}<br>technologia ${extra.technologia}<br>szkolenia ${extra.szkolenie}</td></tr>`;
            const exp = expectedPct();
            return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h2 class="font-bold text-gray-800">Realizacja wskaźników ${year}</h2>
                    <p class="text-xs text-gray-500">${exp != null ? `Oczekiwany postęp wg kalendarza: ${exp}%. Kolor: zielony – w normie, żółty – lekko w tyle, czerwony – ponad 15 p.p. w tyle. ` : ''}Kliknij pracownika, by zobaczyć szczegóły.</p></div>
                    <div class="flex gap-2 no-print"><button class="btn btn-ghost" onclick="exportCsv()"><i data-lucide="download" class="w-4 h-4"></i> Eksport CSV</button>
                    <button class="btn btn-ghost" onclick="window.print()"><i data-lucide="printer" class="w-4 h-4"></i> Drukuj</button></div></div>
                ${historyError ? '<p class="text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3 mb-3">Nie udało się wczytać historii zwrotów – wypożyczenia liczone tylko z aktywnych.</p>' : ''}
                <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th>Pracownik</th>${INDICATORS.map(i => `<th>${i.label}</th>`).join('')}<th>Pozostałe</th></tr></thead><tbody>${rows}${total}</tbody></table></div></div>`;
        }
        function teamStats() {
            const m = monthlyStats(employees());
            const keys = [['newPesel', 'Nowy PESEL'], ['porada', 'Porady'], ['instruktaz', 'Instruktaże'], ['testowanie', 'Testowania'], ['wypozyczenie', 'Wypożyczenia'], ['kontakt', 'Kontakty'], ['technologia', 'Zaproponowana tech.'], ['szkolenie', 'Szkolenia']];
            const tot = m.map(r => keys.reduce((a, [k]) => a + r[k], 0)), max = Math.max(1, ...tot);
            const rows = m.map((r, i) => `<tr><td class="font-semibold">${MONTHS[i]}</td>${keys.map(([k]) => `<td class="${r[k] ? '' : 'text-gray-300'}">${r[k]}</td>`).join('')}
                <td class="min-w-[10rem]"><div class="flex items-center gap-2"><div class="bar flex-1" aria-hidden="true"><i style="width:${tot[i] / max * 100}%;background:#45a94d"></i></div><b class="w-8 text-right">${tot[i]}</b></div></td></tr>`).join('');
            const sum = keys.map(([k]) => m.reduce((a, r) => a + r[k], 0));
            // Udział pracowników w sumie wszystkich czynności
            const share = employees().map(em => {
                const s = computeStats(em); return { em, total: s.newPesel + s.porada + s.instruktaz + s.testowanie + s.wypozyczenie + s.kontakt + s.technologia + s.szkolenie };
            });
            const smax = Math.max(1, ...share.map(x => x.total));
            return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
                <h2 class="font-bold text-gray-800 mb-1">Aktywność zespołu w ${year} – miesiąc po miesiącu</h2>
                <p class="text-xs text-gray-500 mb-3">Wypożyczenia: z katalogu (wg daty wypożyczenia) + wpisane ręcznie + ogólnopolska.</p>
                <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th>Miesiąc</th>${keys.map(([, l]) => `<th>${l}</th>`).join('')}<th>Razem</th></tr></thead><tbody>${rows}
                    <tr class="bg-gray-50 font-bold"><td>Suma</td>${sum.map(v => `<td>${v}</td>`).join('')}<td>${sum.reduce((a, b) => a + b, 0)}</td></tr></tbody></table></div></div>
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mt-5"><h2 class="font-bold text-gray-800 mb-3">Liczba czynności na pracownika</h2>
                ${share.map(x => `<div class="flex items-center gap-3 mb-2"><span class="w-40 text-sm font-semibold truncate">${esc(nameOf(x.em))}</span><div class="bar flex-1" aria-hidden="true"><i style="width:${x.total / smax * 100}%;background:#2b7333"></i></div><b class="w-10 text-right">${x.total}</b></div>`).join('')}</div>`;
        }
        // ===== IMPORT STARYCH OSÓB =====
        // Osoby obsłużone przed wdrożeniem aplikacji trafiają do rejestru, żeby ich pierwszy wpis nie liczył się jako „Nowy PESEL”.
        let importPreview = null, importBusy = false;
        async function readArchive(file) {
            if (!file) return;
            if (!window.XLSX) { alert('Biblioteka Excel nie załadowała się. Odśwież stronę.'); return; }
            if (!regOk()) { alert('Rejestr osób jest niedostępny. Sprawdź reguły Firebase.'); return; }
            try {
                const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false, defval: '' });
                const seen = new Map(); let skipped = 0;
                for (const raw of rows) {
                    if (!Array.isArray(raw)) continue;
                    const cells = raw.map(c => String(c == null ? '' : c).trim()).filter(Boolean); if (!cells.length) continue;
                    const name = cells.slice(0, 2).join(' ').trim(), k = personKey(name);
                    if (!k || ['imie', 'nazwisko', 'imie nazwisko', 'lp', 'beneficjent', 'ozn'].includes(norm(name))) continue;
                    if (seen.has(k)) { skipped++; continue; }
                    seen.set(k, name);
                }
                const items = [];
                for (const [k, name] of seen) { const h = await hashKey(k); if (KEYS[h]) skipped++; else items.push({ h, name }); }
                importPreview = { items, skipped };
            } catch (e) { alert('Nie udało się odczytać pliku: ' + e.message); }
            render();
        }
        async function confirmImport() {
            if (!importPreview || !importPreview.items.length || importBusy) return;
            importBusy = true; render();
            const own = ek(me.email), items = importPreview.items;
            try {
                for (let i = 0; i < items.length; i += 200) {
                    const upd = {};
                    items.slice(i, i + 200).forEach(it => {
                        const id = database.ref('indicators/persons').push().key;
                        upd['persons/' + id] = { name: it.name, tag: '', createdBy: own, createdAt: firebase.database.ServerValue.TIMESTAMP, imported: true };
                        upd['personKeys/' + it.h] = id;
                    });
                    await database.ref('indicators').update(upd);
                }
                alert('Zaimportowano ' + items.length + ' osób.'); importPreview = null;
            } catch (e) { alert('Błąd importu (część osób mogła się zapisać, ponów import): ' + e.message); }
            importBusy = false; render();
        }
        function importView() {
            const p = importPreview, total = Object.keys(PERSONS).length;
            return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 max-w-3xl">
                <h2 class="font-bold text-gray-800 mb-1">Import osób obsłużonych wcześniej</h2>
                <p class="text-sm text-gray-600 mb-3">Wgraj plik Excel (.xlsx, .xls) lub .csv. Pierwsza kolumna to imię i nazwisko (albo imię w A, nazwisko w B). Te osoby trafią do rejestru, więc ich pierwszy wpis nie policzy się jako „Nowy PESEL”. Duplikaty są pomijane.</p>
                <p class="text-xs text-gray-500 mb-3">${regOk() ? `Aktualnie w rejestrze: <b>${total}</b> osób.` : '<span class="text-red-600">Rejestr osób jest niedostępny. Sprawdź reguły Firebase i listę indicators/staff.</span>'}</p>
                <input id="archFile" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="readArchive(this.files[0]);this.value=''">
                <button class="btn btn-ghost" onclick="$('archFile').click()" ${importBusy || !regOk() ? 'disabled' : ''}><i data-lucide="upload" class="w-4 h-4"></i> Wybierz plik</button>
                ${p ? `<div class="mt-4 border border-gray-200 rounded-xl p-3 bg-gray-50"><p class="text-sm">Do dodania: <b>${p.items.length}</b>${p.skipped ? ` · pominięto duplikaty: <b>${p.skipped}</b>` : ''}</p>
                    ${p.items.length ? `<p class="text-xs text-gray-500 mt-2 max-h-40 overflow-auto">${p.items.slice(0, 60).map(i => esc(i.name)).join(', ')}${p.items.length > 60 ? ` … +${p.items.length - 60}` : ''}</p>` : ''}
                    <div class="flex gap-2 mt-3"><button class="btn btn-primary" onclick="confirmImport()" ${importBusy || !p.items.length ? 'disabled' : ''}>${importBusy ? 'Importuję…' : `Zatwierdź import (${p.items.length})`}</button>
                    <button class="btn btn-ghost" onclick="importPreview=null;render()" ${importBusy ? 'disabled' : ''}>Anuluj</button></div></div>` : ''}</div>`;
        }
        function empDetail() {
            const emps = employees();
            if (!selectedEmp || !emps.includes(selectedEmp)) selectedEmp = emps[0];
            const t = targetsFor(selectedEmp);
            const sel = `<select class="fld !w-auto" aria-label="Pracownik" onchange="selectedEmp=this.value;render()">${emps.map(e => `<option value="${esc(e)}" ${e === selectedEmp ? 'selected' : ''}>${esc(nameOf(e))}</option>`).join('')}</select>`;
            const tform = `<details class="mt-4 bg-white rounded-2xl border border-gray-100 shadow-sm p-4 no-print"><summary class="cursor-pointer font-semibold text-sm text-gray-700">Wymagane wskaźniki ${year} dla tego pracownika (edycja)</summary>
                <form class="grid grid-cols-2 md:grid-cols-6 gap-3 mt-3 items-end" onsubmit="saveTargets(event)">
                ${INDICATORS.map(i => `<div><label class="lbl" for="t_${i.key}">${i.label}</label><input class="fld" id="t_${i.key}" name="${i.key}" type="number" min="0" value="${t[i.key]}"></div>`).join('')}
                <button class="btn btn-primary justify-center" type="submit">Zapisz</button></form></details>`;
            return `<div class="flex flex-wrap items-center gap-3 mb-5 no-print"><span class="text-sm text-gray-500">Pracownik:</span>${sel}<span class="text-xs text-gray-400">podgląd tylko do odczytu</span></div>
                ${employeeView(selectedEmp, true)}${tform}`;
        }
        function saveTargets(ev) {
            ev.preventDefault();
            const data = {}; INDICATORS.forEach(i => data[i.key] = n(ev.target.elements[i.key].value));
            database.ref('indicators/targets/' + ek(selectedEmp) + '/' + year).set(data).catch(e => alert('Błąd zapisu: ' + e.message));
        }
        function exportCsv() {
            const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const lines = [['Pracownik', 'Zakres', 'Data', 'OzN', 'OOzN', 'Nowy PESEL', 'Porada', 'Instruktaż', 'Szkolenie', 'Testowanie', 'Kontakt', 'Zaproponowana technologia', 'Wypożyczenie', 'Przedmiot', 'Notatka']];
            employees().forEach(em => {
                entriesFor(em).filter(e => (e.date || '').startsWith(year)).sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(e => {
                    const d = entryDelta(e);
                    lines.push([nameOf(em), e.scope === 'ogol' ? 'Ogólnopolska' : 'Ośrodek', e.date, entNames(e).ozn, entNames(e).oozn, d.newPesel ? 'tak' : 'nie', d.porada, d.instruktaz, d.szkolenie, d.testowanie, d.kontakt, d.technologia, d.rentManual + d.rentOgol, e.przedmiot || e.przedmiotWniosku || '', e.note || '']);
                });
                rentalsFor(em).filter(r => (r.rentedAt || '').startsWith(year)).forEach(r =>
                    lines.push([nameOf(em), 'Katalog', r.rentedAt, '', r.beneficiary, '', '', '', '', '', '', '', 1, r.itemName + ' ' + r.deviceCode, r.active ? 'wypożyczone' : 'zwrócone ' + r.returnedAt]));
            });
            const blob = new Blob(['﻿' + lines.map(l => l.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'wskazniki_' + year + '.csv'; a.click(); URL.revokeObjectURL(a.href);
        }
    </script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
        if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(() => {}); }
    </script>
</body>
</html>
