<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona nie znaleziona (404) – OWiT Toruń</title>
    <meta name="description" content="Nie znaleziono strony. Wróć do strony głównej OWiT Toruń lub skorzystaj z nawigacji.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://owit-torun.pl/">
    <link rel="icon" href="images/ui/logo owit.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; background: #f9fafb; }
        .skip-link { position: absolute; left: -9999px; top: 1rem; background: #1f5526; color: #fff; padding: .5rem 1.25rem; border-radius: 0 0 .5rem .5rem; font-weight: 700; font-size: 1rem; z-index: 9999; text-decoration: none; transition: left .2s; }

        :focus-visible { outline: 3px solid #2b7333 !important; outline-offset: 3px !important; border-radius: 4px; }
    </style>
    <!-- Open Graph -->
    <meta property="og:title" content="OWiT Toruń - Ośrodek Wsparcia i Testów">
    <meta property="og:description" content="Katalog sprzętu wspomagającego. Bezpłatne wypożyczanie i testowanie technologii asystujących dla osób z niepełnosprawnościami.">
    <meta property="og:image" content="https://owit-torun.pl/images/ui/og-banner.jpg">
    <meta property="og:url" content="https://owit.torun.pl/">
    <meta property="og:type" content="website">
</head>
<body class="min-h-screen flex flex-col">

    <a href="#main" class="skip-link">Przejdź do treści głównej</a>

    <!-- NAWIGACJA -->
    <header id="site-header"></header>

    <!-- MAIN -->
    <main id="main" class="flex-1 flex items-center justify-center pt-32 pb-24 px-4">

            <img src="images/ui/404.png" alt="" class="mx-auto mb-8 max-w-xs w-full" aria-hidden="true">
            <p class="text-green-700 text-xs font-bold uppercase tracking-widest mb-3">Błąd 404</p>
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">Strona nie istnieje</h1>
            <p class="text-gray-600 text-lg leading-relaxed mb-10">
                Szukana strona mogła zostać przeniesiona, usunięta lub wpisano błędny adres URL.
            </p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="index.html"
                   class="inline-flex items-center gap-2 bg-green-700 hover:bg-green-800 text-white font-semibold px-6 py-3 rounded-xl transition-colors shadow-sm">
                    <i data-lucide="home" class="w-4 h-4" aria-hidden="true"></i>
                    Strona główna
                </a>
                <a href="katalog.html"
                   class="inline-flex items-center gap-2 bg-white border border-gray-200 hover:border-green-400 hover:bg-green-50 text-gray-700 hover:text-green-700 font-semibold px-6 py-3 rounded-xl transition-colors shadow-sm">
                    <i data-lucide="package" class="w-4 h-4" aria-hidden="true"></i>
                    Katalog sprzętu
                </a>
                <a href="faq.html"
                   class="inline-flex items-center gap-2 bg-white border border-gray-200 hover:border-green-400 hover:bg-green-50 text-gray-700 hover:text-green-700 font-semibold px-6 py-3 rounded-xl transition-colors shadow-sm">
                    <i data-lucide="help-circle" class="w-4 h-4" aria-hidden="true"></i>
                    FAQ
                </a>
            </div>
        </div>
    </main>

    <!-- STOPKA -->
    <div id="site-footer"></div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
    </script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
    </script>
</body>
</html>
